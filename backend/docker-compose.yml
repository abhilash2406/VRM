version: '3.8'

services:
  api:
    build: .
    container_name: vrm-mgt-api
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=truck-mgt
      # Copy other necessary environment variables from your local .env if needed
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: vrm-mgt-db
    restart: unless-stopped
    ports:
      - '5432:5432' # Exposing the port so you can connect via GUI tools
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=truck-mgt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d truck-mgt']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
